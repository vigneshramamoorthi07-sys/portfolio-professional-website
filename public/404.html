<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Vignesh Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #08080a;
        color: #f1f1f5;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .code {
        font-family: 'Outfit', sans-serif;
        font-size: 8rem;
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(135deg, #ff3344, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        font-size: 1.5rem;
        margin: 1rem 0;
      }
      p {
        color: #a1a1aa;
        max-width: 400px;
        margin: 0 auto 2rem;
        font-size: 0.95rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        background: #ff3344;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        box-shadow: 0 10px 25px -5px rgba(255, 51, 68, 0.4);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for doesn't exist or has been moved to another URL.</p>
      <a href="/" class="btn">Return to Portfolio</a>
    </div>
  </body>
</html>
